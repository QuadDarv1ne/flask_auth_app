{% extends "layouts/base.html" %}
{% block title %}Ошибка 403{% endblock %}

{% block content %}
<div class="container text-center mt-5">

    <p class="lead">{{ error_message or "У вас нет прав для доступа к этой странице." }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg mt-4">Вернуться на главную</a>
</div>
{% endblock %}
